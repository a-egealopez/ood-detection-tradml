[tool.poetry]
name = "ood-detection-tradml"
version = "0.1.0"
description = "Didactic unsupervised anomaly / out-of-distribution detection with classical ML: synthetic scikit-learn datasets and event-driven time series from the CASAS dementia dataset."
authors = ["Your Name <your-email@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^1.24"
pandas = "^2.0"
scikit-learn = "^1.3"
scipy = "^1.11"
streamlit = "^1.30"
plotly = "^5.17"
hmmlearn = "^0.2.7"
tick = "^0.7.1"
pyod = "^1.1.1"

[tool.poetry.dev-dependencies]
pytest = ">=8.0"
ruff = ">=0.16.2"
pyright = ">=1.1.350"
vulture = "^2.10"
pip-audit = ">=2.7.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F",   # syntax / pyflakes errors
    "W",        # warnings (unused vars, etc.)
    "B",        # flake8-bugbear (common bugs)
    "SIM",      # flake8-simplify
    "UP",       # pyupgrade (modern syntax)
    "I",        # isort (import sorting)
    "S",        # flake8-bandit (security)
    "ARG",      # flake8-unused-arguments
    "C4",       # flake8-comprehensions
    "RUF",      # ruff-specific rules
]
ignore = [
    "E501",   # long plotly/markdown strings are intentional in this didactic app
    "RUF001", # σ (sigma) is used intentionally in the playground math labels
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the pytest idiom; bandit's S101 is for prod code

[tool.pyright]
# Strict type checking for deterministic correction workflow
pythonVersion = "3.10"
typeCheckingMode = "strict"
pythonPlatform = "Linux"
venvPath = "."
venv = "venv"
reportUnusedImport = true
reportUnusedVariable = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingParameterType = false
reportMissingTypeArgument = false
# The repo uses scikit-learn-style uppercase "X" for the feature matrix (idiom);
# pyright treats it as a module-level constant and flags redefinition.
reportConstantRedefinition = false
# streamlit's @st.cache_data is not typed in the official stubs.
reportUntypedFunctionDecorator = false
exclude = [
    "data",
    "logs",
    "venv",
    ".git",
    "__pycache__",
    "tests",
    "*.pyc",
]
stubPath = "stubs"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.vulture]
exclude = [
    "data/**",
    "logs/**",
    "venv/**",
    ".git/**",
    "**/__pycache__/**",
    "*.pyc",
]
min_confidence = 80
ignore_decorators = [
    "st.cache_data",
    "st.cache_resource",
    "st.fragment",
    "property",
    "staticmethod",
    "classmethod",
]
ignore_names = [
    "_next",
    "_back",
    "_scroll_to_top",
    "_render_features_step",
    "_render_detect_step",
    "_render_ensemble_step",
    "main",
    "generate_fixtures",
    "run_evaluation",
    "run_matrix",
    "verify_pipeline",
    "DETECTOR_FACTORY",
    "FIXED_PARAMS",
    "DETECTOR_REGISTRY",
    "DETECTOR_NAMES",
    "DETECTOR_DEFAULTS_LIST",
    "DETECTOR_CATEGORIES",
    "ENSEMBLE_DEFAULTS",
    "run_module",
    "setup_logging",
    "db_path",
    "fitted_attr",
]

[tool.pip-audit]
# Security audit config
desc = true
format = "json"
output = "audit.json"
skip-editable = true
local = false
