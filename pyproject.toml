[tool.poetry]
name = "ood-detection-tradml"
version = "0.1.0"
description = "Didactic unsupervised anomaly / out-of-distribution detection with classical ML: synthetic scikit-learn datasets and event-driven time series from the CASAS dementia dataset."
authors = ["Your Name <your-email@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^1.24"
pandas = "^2.0"
scikit-learn = "^1.3"
scipy = "^1.11"
streamlit = "^1.30"
plotly = "^5.17"
hmmlearn = "^0.2.7"
tick = "^0.7.1"
pyod = "^1.1.1"

[tool.poetry.dev-dependencies]
ruff = ">=0.16.2"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE001", "S110", "SIM", "C4", "RUF", "UP"]
ignore = [
    "E501",   # long plotly/markdown strings are intentional in this didactic app
    "RUF001", # σ (sigma) is used intentionally in the playground math labels
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
