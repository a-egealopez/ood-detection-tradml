[tool.poetry]
name = "ood-detection-tradml"
version = "0.1.0"
description = "Didactic unsupervised anomaly / out-of-distribution detection with classical ML: synthetic scikit-learn datasets and event-driven time series from the CASAS dementia dataset."
authors = ["Your Name <your-email@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^1.24"
pandas = "^2.0"
scikit-learn = "^1.3"
scipy = "^1.11"
streamlit = "^1.30"
plotly = "^5.17"
hmmlearn = "^0.2.7"
tick = "^0.7.1"
pyod = "^1.1.1"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
